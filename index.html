<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR出席スキャナ</title>
  <script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                   "Yu Gothic UI", "Meiryo", sans-serif;
      color: #fff;
    }

    /* ========== カメラ ========== */
    #container { position: fixed; inset: 0; }
    video {
      position: absolute; inset: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
    }
    #overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(70vw, 70vh);
      height: min(70vw, 70vh);
      border: 3px dashed rgba(0, 255, 100, 0.85);
      border-radius: 16px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
      z-index: 5;
      pointer-events: none;
    }

    /* ========== 「確認中」全画面オーバーレイ ========== */
    .processing {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(15, 23, 42, .92);
      z-index: 25;
      opacity: 0;
      transition: opacity .15s ease;
      pointer-events: none;
    }
    .processing.show { opacity: 1; pointer-events: auto; }
    .processing .label {
      font-size: clamp(40px, 11vw, 96px);
      font-weight: 900;
      letter-spacing: .08em;
      color: #fff;
      text-align: center;
      padding: 0 16px;
      text-shadow: 0 6px 30px rgba(0,0,0,.4);
      animation: pulse 1.0s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);     opacity: 1;   }
      50%      { transform: scale(1.06);  opacity: .82; }
    }

    /* ========== 結果オーバーレイ ========== */
    .result {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
      z-index: 30;
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }
    .result.show { opacity: 1; pointer-events: auto; }
    .result.ok    { background: linear-gradient(135deg, #10b981, #059669); }
    .result.warn  { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .result .icon {
      font-size: clamp(64px, 18vw, 130px);
      line-height: 1;
      margin-bottom: 18px;
    }
    .result .text {
      font-size: clamp(28px, 7vw, 52px);
      font-weight: 900;
      letter-spacing: .06em;
      text-align: center;
      line-height: 1.3;
      padding: 0 12px;
      text-shadow: 0 6px 30px rgba(0,0,0,.25);
      word-break: break-word;
      white-space: pre-line;
    }
    .result .dismiss {
      position: absolute;
      bottom: 24px;
      font-size: 13px;
      color: rgba(255,255,255,.75);
    }

    /* ========== エラーバナー ========== */
    #error-banner {
      position: absolute;
      top: 0; left: 0; right: 0;
      background: rgba(220, 50, 50, 0.95);
      color: #fff;
      padding: 16px 20px;
      font-size: 14px;
      line-height: 1.5;
      z-index: 50;
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay muted playsinline></video>
    <div id="overlay"></div>

    <!-- 確認中オーバーレイ -->
    <div class="processing" id="processing">
      <div class="label" id="processingLabel"></div>
    </div>

    <!-- 結果オーバーレイ -->
    <div class="result" id="result">
      <div class="icon" id="resultIcon"></div>
      <div class="text" id="resultText"></div>
      <div class="dismiss">タップですぐ次へ</div>
    </div>

    <div id="error-banner"></div>
  </div>

  <script>
    /* ============================================================
     * ★ここに GAS Web アプリの URL を貼り付けてください
     * （デプロイ → 新しいデプロイ で取得した URL）
     * ============================================================ */
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxBsc-V4H6M2LhphtKBf1ioO4DtEExY4ujza2htTLQjEmAwTs33ueCvTuRG9oJi1wIYMA/exec';

    /* ---- 速度パラメータ ---- */
    const RESULT_HOLD_MS  = 400;    // 成功表示の保持時間（タップで即閉じも可）
    const ERROR_HOLD_MS   = 2500;   // エラー表示の保持時間（タップで即閉じも可）
    const CLIENT_GUARD_MS = 2500;   // 同一QRの即時連投防止
    const REQ_TIMEOUT_MS  = 10000;  // 1回あたりの通信タイムアウト
    const MAX_ATTEMPTS    = 3;      // busy・ネットワーク瞬断のときだけ再試行（タイムアウトは再試行しない）
    const RETRY_DELAY_MS  = 800;    // 再試行の間隔（busy応答時はこの1.5倍待つ）
    const SCAN_INTERVAL_MS = 120;   // ZXing の読み取り間隔（短いほど高速）

    const { BrowserQRCodeReader, NotFoundException } = ZXing;
    const video       = document.getElementById('video');
    const processingEl = document.getElementById('processing');
    const processingLabel = document.getElementById('processingLabel');
    const resultEl    = document.getElementById('result');
    const resultIcon  = document.getElementById('resultIcon');
    const resultText  = document.getElementById('resultText');
    const errorBanner = document.getElementById('error-banner');

    let busy = false;
    let reader = null;
    let currentStream = null;
    let lastCode = '';
    let lastCodeAt = 0;

    /* ─── カメラ初期化（最初の1回だけ getUserMedia）─── */
    async function initCamera() {
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
      } catch (err) {
        showError(
          'カメラの起動に失敗しました。\n' +
          'エラー: ' + err.name + ' - ' + err.message + '\n\n' +
          '【対処法】\n' +
          '・アドレスバー左のカメラアイコンから許可を確認\n' +
          '・Chrome 設定 → プライバシー → サイトの設定 → カメラ'
        );
        return;
      }
      video.srcObject = currentStream;
      await video.play().catch(() => {});
      reader = new BrowserQRCodeReader();
      reader.timeBetweenScansMillis = SCAN_INTERVAL_MS;
      startScan();
    }

    /* ─── ZXing スキャン開始（一度だけ起動し、以降は止めずに連続稼働）───
     *  reader.reset() はカメラのトラックを停止してしまうため毎回呼ばない。
     *  読み取り後は busy フラグで受付を止めるだけにし、カメラは生かしたまま。
     *  これにより 1スキャンごとの getUserMedia（カメラ再取得＝数秒）が不要になる。
     */
    function startScan() {
      reader.decodeFromStream(currentStream, video, (result, err) => {
        if (busy) return;
        if (result) {
          const text = result.getText();
          const now = Date.now();
          // 同一QRの短時間連投ガード（先にロックして二重侵入を遮断）
          if (text === lastCode && now - lastCodeAt < CLIENT_GUARD_MS) return;

          busy = true;            // 受付を止める（カメラ・デコーダは動かしたまま）
          lastCode = text;
          lastCodeAt = now;

          processResult(text);
          return;
        }
        if (err && !(err instanceof NotFoundException)) {
          console.error('ZXing:', err);
        }
      });
    }

    /* ─── カメラ生存確認 ─── */
    function streamAlive() {
      return currentStream &&
             currentStream.getVideoTracks().some(t => t.readyState === 'live');
    }

    /* ─── 万一カメラが落ちていた場合のみ取り直す（通常は呼ばれない）─── */
    async function resumeScan() {
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        video.srcObject = currentStream;
        await video.play().catch(() => {});
        reader = new BrowserQRCodeReader();
        reader.timeBetweenScansMillis = SCAN_INTERVAL_MS;
        startScan();
      } catch (err) {
        showError('カメラ再起動失敗: ' + err.message);
      }
    }

    /* ─── QR読取 → GAS に送信 ───
     *  正常時の1サイクルは「送信(通常1〜3秒) → 完了表示0.4秒 → 即次の読み取り」で、
     *  再試行やタイムアウトの設定は正常時の速度に一切影響しない。
     *  再試行するのは「busy応答」「ネットワーク瞬断」「HTTP 5xx」のみ。
     *  タイムアウトはサーバー側で処理が続いている可能性が高く、再試行すると
     *  遅いサーバーへ追い打ちになるため再試行せず、すぐ案内を表示する。
     */
    async function processResult(text) {
      showProcessing('出席確認中…');

      let finalMsg = 'エラー';
      for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
        const r = await tryOnce(text);

        if (r.ok) {
          hideProcessing();
          showResult('check', '出席確認完了');
          finishCycle(RESULT_HOLD_MS);
          return;
        }

        finalMsg = r.msg;

        // 再試行しても直らないエラー（設定ミス・タイムアウト等）は即表示
        if (!r.retryable || attempt === MAX_ATTEMPTS) break;

        showProcessing('出席確認中…（再試行 ' + attempt + '）');
        await sleep(r.wait || RETRY_DELAY_MS);
      }

      hideProcessing();
      showResult('warn', finalMsg);
      finishCycle(ERROR_HOLD_MS);
    }

    /* 1回分の送信。{ok:true} か {retryable, msg, wait} を返す */
    async function tryOnce(text) {
      try {
        const url = GAS_URL + '?action=append&data=' + encodeURIComponent(text);
        const json = await fetchWithTimeout(url, REQ_TIMEOUT_MS);

        if (json && json.status === 'ok') return { ok: true };

        if (json && json.status === 'busy') {
          // サーバーは生きているが、他の書き込みのロック待ちで混雑中。
          // 少し長めに待ってから再試行する価値がある。
          return {
            retryable: true,
            wait: Math.round(RETRY_DELAY_MS * 1.5),
            msg: '混雑しています\n少し待ってもう一度かざしてください'
          };
        }

        // GAS側で捕捉されたエラー（例: シートが見つかりません）。
        // 設定起因なので再試行しても直らない → メッセージをそのまま表示。
        return {
          retryable: false,
          msg: '記録エラー\n' + ((json && json.message) || '不明なエラー')
        };

      } catch (err) {
        console.error('送信エラー:', err);

        if (err.name === 'AbortError') {
          // タイムアウト：サーバー側では処理が続いていて遅れて記録されることが多い。
          // サーバーに30秒の同一QR重複防止があるため、もう一度かざしても二重記録されない。
          return {
            retryable: false,
            msg: 'サーバー応答待ちタイムアウト（' + (REQ_TIMEOUT_MS / 1000) + '秒）\n' +
                 '記録は遅れて完了している場合があります\n' +
                 '少し待ってもう一度かざして確認してください'
          };
        }

        if (err.kind === 'http') {
          return {
            retryable: err.httpStatus >= 500,   // 5xxは一時障害の可能性 → 再試行
            msg: 'サーバーエラー（HTTP ' + err.httpStatus + '）\n' +
                 (err.httpStatus >= 500
                   ? 'Google側の一時的な障害の可能性があります'
                   : 'GASのデプロイURL・設定を確認してください')
          };
        }

        if (err.kind === 'badresponse') {
          return {
            retryable: false,
            msg: 'サーバー応答が不正です（JSONではない応答）\n' +
                 'GASのデプロイ設定「アクセスできるユーザー: 全員」を確認してください'
          };
        }

        // fetch自体の失敗 ＝ 端末側のネットワーク問題が濃厚。瞬断なら再試行で直る。
        return {
          retryable: true,
          msg: 'ネットワークエラー\nWi-Fi・電波状況を確認してください\n（' + err.message + '）'
        };
      }
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function fetchWithTimeout(url, ms) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      try {
        const res = await fetch(url, { redirect: 'follow', signal: ctrl.signal });
        if (!res.ok) {
          const e = new Error('HTTP ' + res.status);
          e.kind = 'http';
          e.httpStatus = res.status;
          throw e;
        }
        try {
          return await res.json();
        } catch (parseErr) {
          if (parseErr.name === 'AbortError') throw parseErr;  // 本文読込中のタイムアウト
          const e = new Error('invalid response');
          e.kind = 'badresponse';
          throw e;
        }
      } finally {
        clearTimeout(timer);
      }
    }

    /* ─── 1サイクル終了 → 結果を隠して次の読み取りへ ───
     *  カメラ・デコーダは動かしたままなので、busy を解除するだけで
     *  即座に次のQRを受け付ける。結果画面はタップで即閉じできる。
     */
    let cycleTimer = null;
    function finishCycle(wait) {
      clearTimeout(cycleTimer);
      cycleTimer = setTimeout(closeResultNow, wait);
    }

    function closeResultNow() {
      clearTimeout(cycleTimer);
      hideResult();
      busy = false;
      if (!streamAlive()) resumeScan();
    }

    /* ─── UI ─── */
    function showProcessing(message) {
      processingLabel.textContent = message;
      processingEl.classList.add('show');
    }
    function hideProcessing() {
      processingEl.classList.remove('show');
    }
    function showResult(type, message) {
      resultIcon.textContent = type === 'check' ? '✅' : '⚠️';
      resultText.textContent = message;
      resultEl.classList.remove('ok', 'warn');
      resultEl.classList.add(type === 'check' ? 'ok' : 'warn', 'show');
    }
    function hideResult() {
      resultEl.classList.remove('show');
    }
    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
      console.error(msg);
    }

    /* ─── 結果画面はタップで即閉じ → すぐ次の読み取りへ ─── */
    resultEl.addEventListener('click', closeResultNow);

    /* ─── 起動 ─── */
    initCamera();
  </script>
</body>
</html>
