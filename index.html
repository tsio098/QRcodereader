<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR出席スキャナ</title>
  <script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                   "Yu Gothic UI", "Meiryo", sans-serif;
      color: #fff;
    }

    /* ========== カメラ ========== */
    #container { position: fixed; inset: 0; }
    video {
      position: absolute; inset: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
    }
    #overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(70vw, 70vh);
      height: min(70vw, 70vh);
      border: 3px dashed rgba(0, 255, 100, 0.85);
      border-radius: 16px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
      z-index: 5;
      pointer-events: none;
    }

    /* ========== 「確認中」全画面オーバーレイ ========== */
    .processing {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(15, 23, 42, .92);
      z-index: 25;
      opacity: 0;
      transition: opacity .15s ease;
      pointer-events: none;
    }
    .processing.show { opacity: 1; pointer-events: auto; }
    .processing .label {
      font-size: clamp(40px, 11vw, 96px);
      font-weight: 900;
      letter-spacing: .08em;
      color: #fff;
      text-align: center;
      padding: 0 16px;
      text-shadow: 0 6px 30px rgba(0,0,0,.4);
      animation: pulse 1.0s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);     opacity: 1;   }
      50%      { transform: scale(1.06);  opacity: .82; }
    }

    /* ========== 結果オーバーレイ ========== */
    .result {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
      z-index: 30;
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }
    .result.show { opacity: 1; pointer-events: auto; }
    .result.ok    { background: linear-gradient(135deg, #10b981, #059669); }
    .result.warn  { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .result .icon {
      font-size: clamp(64px, 18vw, 130px);
      line-height: 1;
      margin-bottom: 18px;
    }
    .result .text {
      font-size: clamp(28px, 7vw, 52px);
      font-weight: 900;
      letter-spacing: .06em;
      text-align: center;
      line-height: 1.3;
      padding: 0 12px;
      text-shadow: 0 6px 30px rgba(0,0,0,.25);
      word-break: break-word;
    }

    /* ========== エラーバナー ========== */
    #error-banner {
      position: absolute;
      top: 0; left: 0; right: 0;
      background: rgba(220, 50, 50, 0.95);
      color: #fff;
      padding: 16px 20px;
      font-size: 14px;
      line-height: 1.5;
      z-index: 50;
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay muted playsinline></video>
    <div id="overlay"></div>

    <!-- 確認中オーバーレイ -->
    <div class="processing" id="processing">
      <div class="label" id="processingLabel"></div>
    </div>

    <!-- 結果オーバーレイ -->
    <div class="result" id="result">
      <div class="icon" id="resultIcon"></div>
      <div class="text" id="resultText"></div>
    </div>

    <div id="error-banner"></div>
  </div>

  <script>
    /* ============================================================
     * ★ここに GAS Web アプリの URL を貼り付けてください
     * （デプロイ → 新しいデプロイ で取得した URL）
     * ============================================================ */
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxBsc-V4H6M2LhphtKBf1ioO4DtEExY4ujza2htTLQjEmAwTs33ueCvTuRG9oJi1wIYMA/exec';

    /* ---- 速度パラメータ ---- */
    const RESULT_HOLD_MS  = 700;    // 成功表示を出してから次の読み取りまでの保持時間
    const ERROR_HOLD_MS   = 1500;   // エラー表示の保持時間
    const CLIENT_GUARD_MS = 2500;   // 同一QRの即時連投防止
    const REQ_TIMEOUT_MS  = 15000;  // 通信タイムアウト
    const SCAN_INTERVAL_MS = 120;   // ZXing の読み取り間隔（短いほど高速）

    const { BrowserQRCodeReader, NotFoundException } = ZXing;
    const video       = document.getElementById('video');
    const processingEl = document.getElementById('processing');
    const processingLabel = document.getElementById('processingLabel');
    const resultEl    = document.getElementById('result');
    const resultIcon  = document.getElementById('resultIcon');
    const resultText  = document.getElementById('resultText');
    const errorBanner = document.getElementById('error-banner');

    let busy = false;
    let reader = null;
    let currentStream = null;
    let lastCode = '';
    let lastCodeAt = 0;

    /* ─── カメラ初期化（最初の1回だけ getUserMedia）─── */
    async function initCamera() {
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
      } catch (err) {
        showError(
          'カメラの起動に失敗しました。\n' +
          'エラー: ' + err.name + ' - ' + err.message + '\n\n' +
          '【対処法】\n' +
          '・アドレスバー左のカメラアイコンから許可を確認\n' +
          '・Chrome 設定 → プライバシー → サイトの設定 → カメラ'
        );
        return;
      }
      video.srcObject = currentStream;
      await video.play().catch(() => {});
      reader = new BrowserQRCodeReader();
      reader.timeBetweenScansMillis = SCAN_INTERVAL_MS;
      startScan();
    }

    /* ─── ZXing スキャン開始 ─── */
    function startScan() {
      reader.decodeFromStream(currentStream, video, (result, err) => {
        if (busy) return;
        if (result) {
          const text = result.getText();
          const now = Date.now();
          // 同一QRの短時間連投ガード（先にロックして二重侵入を遮断）
          if (text === lastCode && now - lastCodeAt < CLIENT_GUARD_MS) return;

          busy = true;
          lastCode = text;
          lastCodeAt = now;

          try { reader.reset(); } catch (e) {}
          processResult(text);
          return;
        }
        if (err && !(err instanceof NotFoundException)) {
          console.error('ZXing:', err);
        }
      });
    }

    /* ─── 再スキャン（カメラは止めず、読み取りだけ再開）─── */
    async function resumeScan() {
      // ストリームが生きていればそのまま読み取りを再開（getUserMedia を呼ばない＝高速）
      const live = currentStream &&
                   currentStream.getVideoTracks().some(t => t.readyState === 'live');
      try {
        if (!live) {
          // 万一カメラが停止していた場合のみ取り直す
          currentStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
          });
          video.srcObject = currentStream;
          await video.play().catch(() => {});
        }
        if (!reader) reader = new BrowserQRCodeReader();
        reader.timeBetweenScansMillis = SCAN_INTERVAL_MS;
        startScan();
      } catch (err) {
        showError('カメラ再起動失敗: ' + err.message);
      }
    }

    /* ─── QR読取 → GAS に送信 ─── */
    async function processResult(text) {
      showProcessing('出席確認中…');

      let json = null;
      try {
        const url = GAS_URL
          + '?action=append'
          + '&data=' + encodeURIComponent(text);

        json = await fetchWithTimeout(url, REQ_TIMEOUT_MS);
      } catch (err) {
        console.error('送信エラー:', err);
        hideProcessing();
        showResult('warn', '通信失敗: ' + err.message);
        finishCycle(ERROR_HOLD_MS);
        return;
      }

      hideProcessing();

      if (json && json.status === 'ok') {
        showResult('check', '出席確認完了');
        finishCycle(RESULT_HOLD_MS);
      } else {
        showResult('warn', '書込エラー: ' + ((json && json.message) || ''));
        finishCycle(ERROR_HOLD_MS);
      }
    }

    async function fetchWithTimeout(url, ms) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      try {
        const res = await fetch(url, { redirect: 'follow', signal: ctrl.signal });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    /* ─── 1サイクル終了 → 結果を隠して次の読み取りへ ─── */
    function finishCycle(wait) {
      setTimeout(() => {
        hideResult();
        busy = false;
        resumeScan();
      }, wait);
    }

    /* ─── UI ─── */
    function showProcessing(message) {
      processingLabel.textContent = message;
      processingEl.classList.add('show');
    }
    function hideProcessing() {
      processingEl.classList.remove('show');
    }
    function showResult(type, message) {
      resultIcon.textContent = type === 'check' ? '✅' : '⚠️';
      resultText.textContent = message;
      resultEl.classList.remove('ok', 'warn');
      resultEl.classList.add(type === 'check' ? 'ok' : 'warn', 'show');
    }
    function hideResult() {
      resultEl.classList.remove('show');
    }
    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
      console.error(msg);
    }

    /* ─── 起動 ─── */
    initCamera();
  </script>
</body>
</html>
