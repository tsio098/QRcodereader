<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR出席スキャナ</title>
  <script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                   "Yu Gothic UI", "Meiryo", sans-serif;
      color: #fff;
    }

    /* ========== カメラ ========== */
    #container { position: fixed; inset: 0; }
    video {
      position: absolute; inset: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
    }
    #overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(70vw, 70vh);
      height: min(70vw, 70vh);
      border: 3px dashed rgba(0, 255, 100, 0.85);
      border-radius: 16px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
      z-index: 5;
      pointer-events: none;
    }

    /* ========== 送信キューバッジ（画面右上） ========== */
    #queue-badge {
      position: absolute;
      top: 12px; right: 12px;
      z-index: 40;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(59, 130, 246, .9);   /* 青: 送信待ち（正常） */
      color: #fff;
      display: none;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    #queue-badge.trouble {
      background: rgba(239, 68, 68, .95);   /* 赤: 送信失敗が続いている */
    }

    /* ========== 結果オーバーレイ ========== */
    .result {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
      z-index: 30;
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }
    .result.show { opacity: 1; pointer-events: auto; }
    .result.ok    { background: linear-gradient(135deg, #10b981, #059669); }
    .result.warn  { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .result .icon {
      font-size: clamp(64px, 18vw, 130px);
      line-height: 1;
      margin-bottom: 18px;
    }
    .result .text {
      font-size: clamp(28px, 7vw, 52px);
      font-weight: 900;
      letter-spacing: .06em;
      text-align: center;
      line-height: 1.3;
      padding: 0 12px;
      text-shadow: 0 6px 30px rgba(0,0,0,.25);
      word-break: break-word;
      white-space: pre-line;
    }
    .result .dismiss {
      position: absolute;
      bottom: 24px;
      font-size: 13px;
      color: rgba(255,255,255,.75);
    }

    /* ========== エラーバナー ========== */
    #error-banner {
      position: absolute;
      top: 0; left: 0; right: 0;
      background: rgba(220, 50, 50, 0.95);
      color: #fff;
      padding: 16px 20px;
      font-size: 14px;
      line-height: 1.5;
      z-index: 50;
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay muted playsinline></video>
    <div id="overlay"></div>

    <!-- 送信キューの状態（0件なら非表示） -->
    <div id="queue-badge"></div>

    <!-- 結果オーバーレイ -->
    <div class="result" id="result">
      <div class="icon" id="resultIcon"></div>
      <div class="text" id="resultText"></div>
      <div class="dismiss">タップですぐ次へ</div>
    </div>

    <div id="error-banner"></div>
  </div>

  <script>
    /* ============================================================
     * ★ここに GAS Web アプリの URL を貼り付けてください
     * （デプロイ → 新しいデプロイ で取得した URL）
     * ============================================================ */
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxBsc-V4H6M2LhphtKBf1ioO4DtEExY4ujza2htTLQjEmAwTs33ueCvTuRG9oJi1wIYMA/exec';

    /* ---- 速度パラメータ ----
     *  ★方式変更（タイムアウト対策）★
     *  スキャン時はサーバー応答を待たず、端末内キュー（localStorage永続）に積んで
     *  即✅を表示する。送信は裏で複数件を1リクエストにまとめて行い、失敗しても
     *  自動再送する（スキャンIDでサーバー側が二重記録を防ぐので再送は安全）。
     *  → 10人連続でも読み取りはカメラ速度のみで進み、タイムアウトが生徒に見えない。
     */
    const RESULT_HOLD_MS   = 400;    // ✅表示の保持時間（タップで即閉じも可）
    const RESCAN_GUARD_MS  = 30000;  // 同一QRの再スキャンをこの間は「記録済み」として弾く
    const REQ_TIMEOUT_MS   = 25000;  // 裏送信のタイムアウト（生徒は待たないので長めでよい）
    const BATCH_MAX_ITEMS  = 50;     // 1リクエストにまとめる最大件数
    const RETRY_BASE_MS    = 2000;   // 送信失敗時の再送間隔（指数バックオフの初期値）
    const RETRY_MAX_MS     = 30000;  // 再送間隔の上限
    const SCAN_INTERVAL_MS = 120;    // ZXing の読み取り間隔（短いほど高速）
    const QUEUE_KEY        = 'qrAttendQueueV1';  // localStorage キー

    const { BrowserQRCodeReader, NotFoundException } = ZXing;
    const video       = document.getElementById('video');
    const queueBadge  = document.getElementById('queue-badge');
    const resultEl    = document.getElementById('result');
    const resultIcon  = document.getElementById('resultIcon');
    const resultText  = document.getElementById('resultText');
    const errorBanner = document.getElementById('error-banner');

    let busy = false;
    let reader = null;
    let currentStream = null;
    const recentScans = new Map();   // QR文字列 → 最終スキャン時刻（再スキャンガード用）

    /* ─── カメラ初期化（最初の1回だけ getUserMedia）─── */
    async function initCamera() {
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
      } catch (err) {
        showError(
          'カメラの起動に失敗しました。\n' +
          'エラー: ' + err.name + ' - ' + err.message + '\n\n' +
          '【対処法】\n' +
          '・アドレスバー左のカメラアイコンから許可を確認\n' +
          '・Chrome 設定 → プライバシー → サイトの設定 → カメラ'
        );
        return;
      }
      video.srcObject = currentStream;
      await video.play().catch(() => {});
      reader = new BrowserQRCodeReader();
      reader.timeBetweenScansMillis = SCAN_INTERVAL_MS;
      startScan();
    }

    /* ─── ZXing スキャン開始（一度だけ起動し、以降は止めずに連続稼働）───
     *  reader.reset() はカメラのトラックを停止してしまうため毎回呼ばない。
     *  読み取り後は busy フラグで受付を止めるだけにし、カメラは生かしたまま。
     *  これにより 1スキャンごとの getUserMedia（カメラ再取得＝数秒）が不要になる。
     */
    function startScan() {
      reader.decodeFromStream(currentStream, video, (result, err) => {
        if (busy) return;
        if (result) {
          const text = result.getText().trim();
          const now = Date.now();
          if (!text || text.length > 64) return;   // 明らかに出席QRでないものは無視

          // 同一QRの再スキャンガード：30秒以内なら「記録済み」を出すだけで積まない
          const last = recentScans.get(text) || 0;
          if (now - last < RESCAN_GUARD_MS) {
            busy = true;
            showResult('check', '記録済みです');
            finishCycle(RESULT_HOLD_MS);
            return;
          }

          busy = true;            // 受付を止める（カメラ・デコーダは動かしたまま）
          recentScans.set(text, now);
          pruneRecentScans(now);

          // キューに積んで即✅（サーバー応答は待たない）
          enqueueScan(text, now);
          showResult('check', '出席 記録しました');
          finishCycle(RESULT_HOLD_MS);
          return;
        }
        if (err && !(err instanceof NotFoundException)) {
          console.error('ZXing:', err);
        }
      });
    }

    function pruneRecentScans(now) {
      for (const [code, t] of recentScans) {
        if (now - t >= RESCAN_GUARD_MS) recentScans.delete(code);
      }
    }

    /* ─── カメラ生存確認 ─── */
    function streamAlive() {
      return currentStream &&
             currentStream.getVideoTracks().some(t => t.readyState === 'live');
    }

    /* ─── 万一カメラが落ちていた場合のみ取り直す（通常は呼ばれない）─── */
    async function resumeScan() {
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        video.srcObject = currentStream;
        await video.play().catch(() => {});
        reader = new BrowserQRCodeReader();
        reader.timeBetweenScansMillis = SCAN_INTERVAL_MS;
        startScan();
      } catch (err) {
        showError('カメラ再起動失敗: ' + err.message);
      }
    }

    /* ============================================================
     * 送信キュー（localStorage 永続）
     *  ・スキャン→enqueueScan で積むだけ。生徒は待たない。
     *  ・drainQueue が裏で複数件を1リクエストにまとめて POST 送信。
     *  ・失敗（タイムアウト・busy・ネットワーク断）は指数バックオフで
     *    無限に再送。各スキャンに一意IDを付け、サーバー側が処理済みIDを
     *    記憶しているので、再送しても二重記録されない。
     *  ・ページを閉じても localStorage に残り、次回起動時に再送される。
     * ============================================================ */
    let queue = loadQueue();
    let draining = false;
    let failStreak = 0;

    function loadQueue() {
      try {
        const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
        return Array.isArray(q) ? q : [];
      } catch (_) {
        return [];
      }
    }

    function saveQueue() {
      try {
        localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
      } catch (e) {
        console.error('キュー保存失敗:', e);
      }
    }

    function makeId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    }

    function enqueueScan(text, ts) {
      queue.push({ id: makeId(), data: text, ts: ts });
      saveQueue();
      updateBadge();
      drainQueue();
    }

    async function drainQueue() {
      if (draining) return;
      draining = true;
      try {
        while (queue.length > 0) {
          const batch = queue.slice(0, BATCH_MAX_ITEMS);
          const r = await postBatch(batch);

          if (r.ok) {
            // 送信できた分をキューから除去
            const sent = new Set(batch.map(it => it.id));
            queue = queue.filter(it => !sent.has(it.id));
            saveQueue();
            failStreak = 0;
            updateBadge();
            continue;
          }

          // busy／タイムアウト／ネットワーク断 → バックオフして再送
          failStreak++;
          updateBadge();
          const wait = Math.min(RETRY_MAX_MS, RETRY_BASE_MS * Math.pow(2, Math.min(failStreak - 1, 4)));
          console.warn('送信失敗（' + failStreak + '回目）: ' + r.reason + ' → ' + wait + 'ms後に再送');
          await sleep(wait);
        }
      } finally {
        draining = false;
      }
    }

    /* 1バッチ送信。{ok:true} か {ok:false, reason} を返す */
    async function postBatch(items) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), REQ_TIMEOUT_MS);
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          redirect: 'follow',
          // text/plain にすることで CORS プリフライト（GAS非対応）を回避
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'appendBatch', items: items }),
          signal: ctrl.signal
        });
        if (!res.ok) return { ok: false, reason: 'HTTP ' + res.status };

        const json = await res.json().catch(() => null);
        if (json && json.status === 'ok') return { ok: true };
        if (json && json.status === 'busy') return { ok: false, reason: 'busy' };
        return { ok: false, reason: (json && json.message) || 'サーバー応答不正' };
      } catch (err) {
        return { ok: false, reason: err.name === 'AbortError' ? 'タイムアウト' : err.message };
      } finally {
        clearTimeout(timer);
      }
    }

    function updateBadge() {
      const n = queue.length;
      if (n === 0) {
        queueBadge.style.display = 'none';
        return;
      }
      queueBadge.style.display = 'block';
      if (failStreak >= 3) {
        queueBadge.classList.add('trouble');
        queueBadge.textContent = '⚠ 再送中 ' + n + '件（Wi-Fi確認）';
      } else {
        queueBadge.classList.remove('trouble');
        queueBadge.textContent = '送信待ち ' + n + '件';
      }
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    /* 未送信が残っている間はページを閉じる前に警告 */
    window.addEventListener('beforeunload', (e) => {
      if (queue.length > 0) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    /* ─── 1サイクル終了 → 結果を隠して次の読み取りへ ───
     *  カメラ・デコーダは動かしたままなので、busy を解除するだけで
     *  即座に次のQRを受け付ける。結果画面はタップで即閉じできる。
     */
    let cycleTimer = null;
    function finishCycle(wait) {
      clearTimeout(cycleTimer);
      cycleTimer = setTimeout(closeResultNow, wait);
    }

    function closeResultNow() {
      clearTimeout(cycleTimer);
      hideResult();
      busy = false;
      if (!streamAlive()) resumeScan();
    }

    /* ─── UI ─── */
    function showResult(type, message) {
      resultIcon.textContent = type === 'check' ? '✅' : '⚠️';
      resultText.textContent = message;
      resultEl.classList.remove('ok', 'warn');
      resultEl.classList.add(type === 'check' ? 'ok' : 'warn', 'show');
    }
    function hideResult() {
      resultEl.classList.remove('show');
    }
    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
      console.error(msg);
    }

    /* ─── 結果画面はタップで即閉じ → すぐ次の読み取りへ ─── */
    resultEl.addEventListener('click', closeResultNow);

    /* ─── 起動 ─── */
    initCamera();
    updateBadge();
    drainQueue();   // 前回終了時の未送信分があれば再送
  </script>
</body>
</html>
